# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'binoymanoj/tmux-minimal-theme'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# start windows numbering at 1
set -g base-index 1

# disable confirmation prompt on kill-window
bind-key & kill-window
bind-key x kill-pane

# tmux-continuum: auto-save every 15 min and auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Status bar at top: windows only
set -g status-position top
set -g status-left ""
set -g status-right ""
set -g status-justify left

#set -g pane-style 'fg=black,bg=colour253'
#set -g pane-active-style 'fg=colour234,bg=colour231'
set -g window-style 'fg=white,bg=#181818'
set -g window-active-style 'fg=white,bg=#202020'

# Per-pane bottom bar: folder icon + current pane path + git info (gitmux)
set -g pane-border-status bottom
set -g pane-border-style "fg=#181818"
set -g pane-active-border-style "fg=#181818"
set -g pane-border-format "#[fg=#b4befe]  #[fg=#cdd6f4]#(echo #{pane_current_path} | sed \"s|^$HOME|~|\") #[fg=#6c7086]│ #(gitmux -cfg ~/.gitmux.conf #{pane_current_path})"

# Override window-status: show first pane's current directory instead of window name
set -g status-interval 5
set-window-option -g window-status-format "#[fg=#6c7086] #{window_index}:#(~/.tmux/scripts/window-label.sh \"$(tmux list-panes -t '#{window_id}' -F '##{pane_current_path}' | head -1)\") "
set-window-option -g window-status-current-format "#[fg=#b4befe,bold] #{window_index}:#(~/.tmux/scripts/window-label.sh \"$(tmux list-panes -t '#{window_id}' -F '##{pane_current_path}' | head -1)\") "
set-window-option -g window-status-separator ""
